<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCLEX & Clinical High-Yield Med Reference Widget</title>
  <style>
    /* =========================================================================
       EDITORIAL CLINICAL STUDY GUIDE THEME & MUTED PALETTE
       ========================================================================= */
    :root {
      color-scheme: light;
      --embed-bg: transparent;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      
      /* Card Sizing & Radii */
      --card-max-width: 580px;
      --card-radius: 12px;
      --badge-radius: 5px;
      --btn-radius: 5px;
      
      /* Warm Off-White / Cream Base Palette */
      --bg-surface: #fcfbf9;
      --bg-subtle: #f5f2ec;
      --bg-hover: #ece8e0;
      --border-color: #e5dfd5;
      --border-subtle: #efebe3;
      --text-main: #2e2a27;
      --text-muted: #706860;
      --text-subtle: #9d958b;
      --shadow-sm: 0 1px 3px rgba(60, 50, 40, 0.04), 0 3px 8px rgba(60, 50, 40, 0.03);
      
      /* Muted, Dusty Category Color System */
      --cat-cardio-text: #8d3645;
      --cat-cardio-bg: #faf0f2;
      --cat-cardio-border: #ecc9ce;
      --cat-cardio-accent: #c25b6a;

      --cat-anticoag-text: #8b3f27;
      --cat-anticoag-bg: #faf2ed;
      --cat-anticoag-border: #eccfc2;
      --cat-anticoag-accent: #bf6347;

      --cat-endocrine-text: #345b41;
      --cat-endocrine-bg: #f0f5f2;
      --cat-endocrine-border: #c5dbcb;
      --cat-endocrine-accent: #5e896b;

      --cat-resp-text: #2d5269;
      --cat-resp-bg: #f0f4f7;
      --cat-resp-border: #c6d7e3;
      --cat-resp-accent: #577e97;

      --cat-neuro-text: #55416a;
      --cat-neuro-bg: #f5f2f8;
      --cat-neuro-border: #d8cfe2;
      --cat-neuro-accent: #7e6c93;

      --cat-antiinfect-text: #725126;
      --cat-antiinfect-bg: #f8f4ec;
      --cat-antiinfect-border: #e7d7be;
      --cat-antiinfect-accent: #a57d47;

      --cat-gi-text: #2b5c58;
      --cat-gi-bg: #eff6f5;
      --cat-gi-border: #c2dede;
      --cat-gi-accent: #4c8783;
      
      /* NCLEX Trap Callout Box (Pale Blush & Dusty Rose) */
      --trap-bg: #faf1f3;
      --trap-border: #f1d3d8;
      --trap-text: #4a242b;
      --trap-accent: #c25b6a;

      /* Antidote Badge (Muted Sage) */
      --antidote-bg: #f1f6f2;
      --antidote-border: #c6dccb;
      --antidote-text: #2f5c3b;
      --antidote-accent: #5e896b;

      /* Study Status Highlights */
      --status-know-bg: #edf5ef;
      --status-know-border: #bddac5;
      --status-know-text: #2d633c;

      --status-review-bg: #faf3ea;
      --status-review-border: #e9cfb4;
      --status-review-text: #8c5424;
    }

    /* Coherent Muted Warm Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --embed-bg: #191919;
        --bg-surface: #23211f;
        --bg-subtle: #2b2825;
        --bg-hover: #37332f;
        --border-color: #3c3732;
        --border-subtle: #302c28;
        --text-main: #ece7e0;
        --text-muted: #a8a095;
        --text-subtle: #787168;
        --shadow-sm: 0 2px 5px rgba(0, 0, 0, 0.35);

        --cat-cardio-text: #f2b2bc;
        --cat-cardio-bg: #341e22;
        --cat-cardio-border: #542931;
        --cat-cardio-accent: #e28b97;

        --cat-anticoag-text: #f3b6a1;
        --cat-anticoag-bg: #352119;
        --cat-anticoag-border: #562e20;
        --cat-anticoag-accent: #dc8e74;

        --cat-endocrine-text: #b7dac2;
        --cat-endocrine-bg: #1e2d23;
        --cat-endocrine-border: #2c4334;
        --cat-endocrine-accent: #8fba9b;

        --cat-resp-text: #b8d5e8;
        --cat-resp-bg: #1c2831;
        --cat-resp-border: #2a3e4e;
        --cat-resp-accent: #8eb3cd;

        --cat-neuro-text: #ccc2de;
        --cat-neuro-bg: #272131;
        --cat-neuro-border: #3d314d;
        --cat-neuro-accent: #ab9bc1;

        --cat-antiinfect-text: #e7cca8;
        --cat-antiinfect-bg: #2e261a;
        --cat-antiinfect-border: #483a24;
        --cat-antiinfect-accent: #cca777;

        --cat-gi-text: #a9d5d3;
        --cat-gi-bg: #1a2b2a;
        --cat-gi-border: #274442;
        --cat-gi-accent: #7cb2ae;

        --trap-bg: #331c21;
        --trap-border: #51242c;
        --trap-text: #f4bbc3;
        --trap-accent: #e28b97;

        --antidote-bg: #1d2c21;
        --antidote-border: #2a4332;
        --antidote-text: #b3dcbd;
        --antidote-accent: #8fba9b;

        --status-know-bg: #1d2d22;
        --status-know-border: #2c4d34;
        --status-know-text: #a5d5b0;

        --status-review-bg: #352317;
        --status-review-border: #563621;
        --status-review-text: #eab991;
      }
    }

    /* Base Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      background: var(--embed-bg);
      overflow-x: hidden;
      scrollbar-color: var(--text-subtle) var(--embed-bg);
    }

    body {
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 4px 2px;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Main Card Container */
    .widget-container {
      width: 100%;
      max-width: var(--card-max-width);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* Category Stripe */
    .category-stripe {
      height: 3px;
      width: 100%;
      background-color: var(--theme-accent, #5e896b);
      transition: background-color 0.25s ease;
    }

    /* 1. Header Bar: Category Context & Study State */
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      gap: 6px;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .category-badge {
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: var(--badge-radius);
      background-color: var(--theme-bg, var(--bg-subtle));
      color: var(--theme-text, var(--text-main));
      border: 1px solid var(--theme-border, var(--border-color));
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .category-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--theme-accent, currentColor);
    }

    .filter-select {
      font-family: var(--font-family);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-muted);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 2px 5px;
      cursor: pointer;
      outline: none;
      transition: all 0.12s ease;
      white-space: nowrap;
    }

    .filter-select:hover, .filter-select:focus {
      color: var(--text-main);
      border-color: var(--text-muted);
      background-color: var(--bg-hover);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* Study Status Segmented Pill Group */
    .status-btn-group {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 1px;
      gap: 1px;
    }

    .status-btn {
      font-family: var(--font-family);
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 2px 5.5px;
      cursor: pointer;
      outline: none;
      transition: all 0.12s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .status-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-hover);
    }

    .status-btn.active-know {
      color: var(--status-know-text);
      background-color: var(--status-know-bg);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--status-know-border);
    }

    .status-btn.active-review {
      color: var(--status-review-text);
      background-color: var(--status-review-bg);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--status-review-border);
    }

    .card-counter {
      font-size: 0.67rem;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 1.5px 5px;
      border-radius: 7px;
      border: 1px solid var(--border-color);
      white-space: nowrap;
    }

    /* 2. Medication Identity / Hero */
    .med-hero {
      padding: 8px 10px 6px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 1.5px;
    }

    .med-name-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      flex-wrap: wrap;
    }

    .med-name {
      font-size: 1.20rem;
      font-weight: 750;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .med-brand {
      font-size: 0.80rem;
      font-weight: 500;
      color: var(--text-muted);
      font-style: italic;
    }

    .med-meta-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.25;
      flex-wrap: wrap;
    }

    .med-class-tag {
      font-weight: 600;
      color: var(--theme-text, var(--text-main));
    }

    .med-meta-dot {
      color: var(--text-subtle);
      font-size: 0.5rem;
    }

    .med-indication-text {
      font-weight: 450;
      color: var(--text-muted);
    }

    /* 3. Body Rows: Clean Scannable Information */
    .med-body {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5.5px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: baseline;
      gap: 6px;
      font-size: 0.79rem;
      line-height: 1.34;
    }

    @media (max-width: 360px) {
      .info-row {
        grid-template-columns: 1fr;
        gap: 1px;
      }
    }

    .label-tag {
      font-size: 0.62rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 1px 4px;
      border-radius: 3.5px;
      text-align: center;
      display: inline-block;
      white-space: nowrap;
      user-select: none;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .label-watch {
      background-color: var(--cat-antiinfect-bg);
      color: var(--cat-antiinfect-text);
      border-color: var(--cat-antiinfect-border);
    }

    .info-text {
      color: var(--text-main);
      font-weight: 400;
    }

    .info-text strong {
      font-weight: 650;
      color: var(--text-main);
    }

    /* Antidote Badge */
    .antidote-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background-color: var(--antidote-bg);
      border: 1px solid var(--antidote-border);
      color: var(--antidote-text);
      font-size: 0.67rem;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 7px;
      margin-top: 1px;
      align-self: flex-start;
    }

    /* NCLEX TRAP Box */
    .nclex-trap-box {
      margin-top: 2px;
      background-color: var(--trap-bg);
      border: 1px solid var(--trap-border);
      border-left: 3px solid var(--trap-accent);
      border-radius: 5px;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 1.5px;
    }

    .trap-header {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .trap-badge {
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--trap-text);
    }

    .trap-content {
      font-size: 0.76rem;
      line-height: 1.32;
      color: var(--text-main);
    }

    .trap-content strong {
      color: var(--trap-text);
      font-weight: 700;
    }

    /* 4. Footer Controls Toolbar */
    .widget-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 7px;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      gap: 5px;
      flex-wrap: wrap;
    }

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .btn {
      font-family: var(--font-family);
      font-size: 0.70rem;
      font-weight: 600;
      color: var(--text-main);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 3px 6.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.12s ease;
      user-select: none;
    }

    .btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .footer-filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: flex-end;
      min-width: 135px;
    }

    .quick-search {
      flex: 1;
      max-width: 115px;
      font-family: var(--font-family);
      font-size: 0.69rem;
      padding: 2.5px 6px;
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      background-color: var(--bg-subtle);
      color: var(--text-main);
      outline: none;
      transition: all 0.15s ease;
    }

    .quick-search:focus {
      max-width: 145px;
      border-color: var(--theme-accent, #5e896b);
      background-color: var(--bg-surface);
    }

    .quick-search::placeholder {
      color: var(--text-subtle);
    }

    /* Empty state */
    .empty-state {
      padding: 20px 10px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      display: none;
    }

    /* Micro-animation */
    .anim-fade {
      animation: cardFadeIn 0.16s ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0.5;
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="widget-container" id="medWidget">
    <!-- Category Accent Line -->
    <div class="category-stripe" id="categoryStripe"></div>

    <!-- Header: Category Context, Status Toggle & Counter -->
    <header class="widget-header">
      <div class="header-left">
        <span class="category-badge" id="categoryBadge">
          <span class="category-dot" id="categoryDot"></span>
          <span id="categoryLabel">CARDIOVASCULAR</span>
        </span>
        <select class="filter-select" id="categoryFilter" aria-label="Filter by category">
          <option value="ALL">All Categories</option>
          <option value="cardio">Cardiovascular</option>
          <option value="anticoag">Anticoagulants / Blood</option>
          <option value="endocrine">Endocrine / Diabetes</option>
          <option value="resp">Respiratory & Steroids</option>
          <option value="neuro">Neuro / Psych / Seizure</option>
          <option value="antiinfect">Antibiotics / Infection</option>
          <option value="gi">GI / Electrolytes / Pain</option>
        </select>
      </div>

      <div class="header-right">
        <div class="status-btn-group">
          <button type="button" class="status-btn" id="btnKnow" title="Mark as Know (click again to clear)" aria-label="Mark as Know">✓ Know</button>
          <button type="button" class="status-btn" id="btnReview" title="Mark as Review (click again to clear)" aria-label="Mark as Review">⟳ Review</button>
        </div>
        <span class="card-counter" id="cardCounter">1 / 1</span>
      </div>
    </header>

    <!-- Medication Content Container -->
    <div id="cardContent" class="anim-fade">
      <!-- Drug Identity Hero -->
      <div class="med-hero">
        <div class="med-name-row">
          <h1 class="med-name" id="medGeneric">---</h1>
          <span class="med-brand" id="medBrand">---</span>
        </div>
        <div class="med-meta-row">
          <span class="med-class-tag" id="medClass">---</span>
          <span class="med-meta-dot">•</span>
          <span class="med-indication-text" id="medIndication">---</span>
        </div>
      </div>

      <!-- High-Yield Nursing Facts Body -->
      <div class="med-body">
        <div class="info-row" id="rowAssess">
          <span class="label-tag">ASSESS</span>
          <span class="info-text" id="textAssess"></span>
        </div>

        <div class="info-row" id="rowMonitor">
          <span class="label-tag">MONITOR</span>
          <span class="info-text" id="textMonitor"></span>
        </div>

        <div class="info-row" id="rowWatch">
          <span class="label-tag label-watch">WATCH FOR</span>
          <span class="info-text" id="textWatch"></span>
        </div>

        <!-- Antidote Badge (Shown conditionally) -->
        <div id="antidoteContainer">
          <div class="antidote-badge-pill" id="antidotePill"></div>
        </div>

        <!-- NCLEX Trap Box -->
        <div class="nclex-trap-box" id="trapBox">
          <div class="trap-header">
            <span class="trap-badge">⚠️ NCLEX &amp; ATI PRIORITY TRAP</span>
          </div>
          <p class="trap-content" id="textTrap"></p>
        </div>
      </div>
    </div>

    <!-- Empty Search State -->
    <div class="empty-state" id="emptyState">
      No matching medications found. Try clearing your search, category, or status filter.
    </div>

    <!-- Navigation & Querying Footer -->
    <footer class="widget-footer">
      <div class="nav-btn-group">
        <button class="btn" id="prevBtn" title="Previous Card (Left Arrow)" aria-label="Previous Medication">◀ Prev</button>
        <button class="btn" id="nextBtn" title="Next Card (Right Arrow)" aria-label="Next Medication">Next ▶</button>
        <button class="btn" id="randomBtn" title="Random Card (Spacebar)" aria-label="Random Medication">🎲 Shuffle</button>
      </div>

      <div class="footer-filter-group">
        <select class="filter-select" id="statusFilter" aria-label="Filter by study status">
          <option value="ALL">All Status</option>
          <option value="know">✓ Know</option>
          <option value="review">⟳ Review</option>
          <option value="unmarked">Unmarked</option>
        </select>
        <input type="text" class="quick-search" id="searchInput" placeholder="🔍 Search..." aria-label="Quick search medication">
      </div>
    </footer>
  </div>

  <!-- Load Dedicated Medication Database -->
  <script src="medications.js"></script>

  <!-- Widget Application Engine -->
  <script>
    /* =========================================================================
       APPLICATION LOGIC, STUDY STATUS PERSISTENCE & INTERACTION ENGINE
       ========================================================================= */

    const STORAGE_KEY = "nclex_med_study_status";

    // Safely retrieve persistent study statuses from localStorage
    function getStudyStatuses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    // Safely save study status for a specific medication generic name
    function setMedStatus(genericName, status) {
      try {
        const statuses = getStudyStatuses();
        if (status) {
          statuses[genericName] = status; // "know" | "review"
        } else {
          delete statuses[genericName];
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(statuses));
      } catch (e) {
        console.warn("localStorage not accessible:", e);
      }
    }

    // Fallback safety check if medications.js is loaded
    const medList = (typeof MEDICATIONS !== 'undefined' && Array.isArray(MEDICATIONS)) ? MEDICATIONS : [];
    const catDefs = (typeof CATEGORIES !== 'undefined') ? CATEGORIES : {};

    let currentList = [...medList];
    let currentIndex = 0;

    // DOM Elements
    const widget = document.getElementById("medWidget");
    const categoryLabel = document.getElementById("categoryLabel");
    const categoryFilter = document.getElementById("categoryFilter");
    const statusFilter = document.getElementById("statusFilter");
    const cardCounter = document.getElementById("cardCounter");
    const cardContent = document.getElementById("cardContent");
    const emptyState = document.getElementById("emptyState");

    const btnKnow = document.getElementById("btnKnow");
    const btnReview = document.getElementById("btnReview");

    const medGeneric = document.getElementById("medGeneric");
    const medBrand = document.getElementById("medBrand");
    const medClass = document.getElementById("medClass");
    const medIndication = document.getElementById("medIndication");
    const textAssess = document.getElementById("textAssess");
    const textMonitor = document.getElementById("textMonitor");
    const textWatch = document.getElementById("textWatch");
    const antidoteContainer = document.getElementById("antidoteContainer");
    const antidotePill = document.getElementById("antidotePill");
    const textTrap = document.getElementById("textTrap");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const randomBtn = document.getElementById("randomBtn");
    const searchInput = document.getElementById("searchInput");

    // Update Know / Review button UI state for current medication
    function updateStatusButtons(genericName) {
      const statuses = getStudyStatuses();
      const currentStatus = statuses[genericName] || null;

      btnKnow.classList.toggle("active-know", currentStatus === "know");
      btnReview.classList.toggle("active-review", currentStatus === "review");
    }

    // Render Current Card
    function renderCard(index) {
      if (currentList.length === 0) {
        cardContent.style.display = "none";
        emptyState.style.display = "block";
        cardCounter.textContent = `0 / 0`;
        btnKnow.classList.remove("active-know");
        btnReview.classList.remove("active-review");
        return;
      }

      cardContent.style.display = "block";
      emptyState.style.display = "none";

      if (index < 0) index = currentList.length - 1;
      if (index >= currentList.length) index = 0;
      currentIndex = index;

      const med = currentList[currentIndex];
      const catConfig = catDefs[med.category] || catDefs.cardio || {
        label: "MEDICATION",
        accent: "#5e896b",
        bg: "var(--bg-subtle)",
        text: "var(--text-main)",
        border: "var(--border-color)"
      };

      // Apply dynamic CSS variables for category accent
      widget.style.setProperty("--theme-accent", catConfig.accent);
      widget.style.setProperty("--theme-bg", catConfig.bg);
      widget.style.setProperty("--theme-text", catConfig.text);
      widget.style.setProperty("--theme-border", catConfig.border);

      categoryLabel.textContent = catConfig.label;
      cardCounter.textContent = `${currentIndex + 1} / ${currentList.length}`;

      // Populate text
      medGeneric.textContent = med.generic;
      medBrand.textContent = med.brand || "";
      medClass.textContent = med.drugClass;
      medIndication.textContent = med.indication;

      textAssess.innerHTML = med.assess;
      textMonitor.innerHTML = med.monitor;
      textWatch.innerHTML = med.watch;
      textTrap.innerHTML = med.trap;

      // Antidote Handling
      if (med.antidote) {
        antidoteContainer.style.display = "block";
        antidotePill.innerHTML = `<span>🛡️ <strong>ANTIDOTE / REVERSAL:</strong> ${med.antidote}</span>`;
      } else {
        antidoteContainer.style.display = "none";
      }

      // Update study status button visual states
      updateStatusButtons(med.generic);

      // Micro-animation trigger
      cardContent.classList.remove("anim-fade");
      void cardContent.offsetWidth; // Trigger reflow
      cardContent.classList.add("anim-fade");
    }

    // Filter Logic (combines Category + Study Status + Search Query)
    function applyFilters() {
      const selectedCategory = categoryFilter.value;
      const selectedStatus = statusFilter.value;
      const query = searchInput.value.trim().toLowerCase();
      const statuses = getStudyStatuses();

      currentList = medList.filter(med => {
        // 1. Category Filter
        const matchesCategory = selectedCategory === "ALL" || med.category === selectedCategory;

        // 2. Study Status Filter
        const medStatus = statuses[med.generic] || "unmarked";
        let matchesStatus = true;
        if (selectedStatus === "know") matchesStatus = (medStatus === "know");
        else if (selectedStatus === "review") matchesStatus = (medStatus === "review");
        else if (selectedStatus === "unmarked") matchesStatus = (medStatus === "unmarked");

        // 3. Search Query Filter
        const matchesSearch = !query || 
          med.generic.toLowerCase().includes(query) ||
          (med.brand && med.brand.toLowerCase().includes(query)) ||
          med.drugClass.toLowerCase().includes(query) ||
          med.indication.toLowerCase().includes(query) ||
          med.trap.toLowerCase().includes(query) ||
          (med.antidote && med.antidote.toLowerCase().includes(query));

        return matchesCategory && matchesStatus && matchesSearch;
      });

      currentIndex = 0;
      renderCard(0);
    }

    // Toggle Study Status for Current Medication
    function handleStatusToggle(targetStatus) {
      if (currentList.length === 0) return;
      const currentMed = currentList[currentIndex];
      const statuses = getStudyStatuses();
      const existingStatus = statuses[currentMed.generic] || null;

      // If already set to this status, clicking again clears it
      const newStatus = (existingStatus === targetStatus) ? null : targetStatus;
      setMedStatus(currentMed.generic, newStatus);
      updateStatusButtons(currentMed.generic);

      // If active filter is specifically filtering by status, refresh list
      if (statusFilter.value !== "ALL") {
        applyFilters();
      }
    }

    // Navigation Actions
    function nextCard() {
      if (currentList.length <= 1) return;
      renderCard(currentIndex + 1);
    }

    function prevCard() {
      if (currentList.length <= 1) return;
      renderCard(currentIndex - 1);
    }

    function randomCard() {
      if (currentList.length <= 1) return;
      let newIdx;
      do {
        newIdx = Math.floor(Math.random() * currentList.length);
      } while (newIdx === currentIndex && currentList.length > 1);
      renderCard(newIdx);
    }

    // Event Listeners
    nextBtn.addEventListener("click", nextCard);
    prevBtn.addEventListener("click", prevCard);
    randomBtn.addEventListener("click", randomCard);
    categoryFilter.addEventListener("change", applyFilters);
    statusFilter.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);

    btnKnow.addEventListener("click", () => handleStatusToggle("know"));
    btnReview.addEventListener("click", () => handleStatusToggle("review"));

    // Keyboard Shortcuts (Arrow keys & Space)
    document.addEventListener("keydown", (e) => {
      if (document.activeElement === searchInput || 
          document.activeElement === categoryFilter || 
          document.activeElement === statusFilter) return;

      if (e.key === "ArrowRight") {
        e.preventDefault();
        nextCard();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevCard();
      } else if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        randomCard();
      }
    });

    // Touch Swipe Support for Mobile & Tablets
    let touchStartX = 0;
    let touchEndX = 0;

    widget.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    widget.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 40) nextCard();
      else if (touchEndX > touchStartX + 40) prevCard();
    }, { passive: true });

    // Initial Load: Start on a random card automatically
    const initialIndex = currentList.length > 0 ? Math.floor(Math.random() * currentList.length) : 0;
    renderCard(initialIndex);
  </script>
</body>
</html>
